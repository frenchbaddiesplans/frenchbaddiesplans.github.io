<!DOCTYPE html>
<html lang="fr">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>French Baddies Nails — Prendre rendez-vous</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --lilas:#f6ddf8; --lilas2:#efc2f4; --rose:#ff0a5e; --rose-fonce:#c4003f;
    --orange:#ff5a1a; --peche:#f7a35c; --encre:#4a0322;
    --verre:rgba(255,255,255,.14); --bord:rgba(246,221,248,.6);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100vh;font-family:'Quicksand',system-ui,sans-serif;font-weight:600;color:#fff;
    background:linear-gradient(160deg,#fe7766 0%,#ff5a1a 30%,#ff0a5e 68%,#ff6601 100%) fixed;
    overflow-x:hidden;
  }
  body::before{ /* reflets satinés façon années 2000 */
    content:"";position:fixed;inset:-20%;pointer-events:none;z-index:0;
    background:
      radial-gradient(40% 30% at 15% 20%,rgba(255,255,255,.28),transparent 70%),
      radial-gradient(35% 25% at 85% 75%,rgba(255,200,240,.25),transparent 70%),
      repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 40px,transparent 40px 90px);
    animation:flotte 18s ease-in-out infinite alternate;
  }
  @keyframes flotte{to{transform:translate3d(4%,3%,0) rotate(2deg)}}
  .wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:0 16px 48px}

  /* Bandeau défilant */
  .ticker{position:relative;z-index:2;overflow:hidden;white-space:nowrap;background:var(--lilas);color:var(--rose);
    font-family:'Shrikhand','Cooper Black','Arial Rounded MT Bold','Trebuchet MS',sans-serif;font-size:14px;padding:6px 0;border-bottom:2px solid #fff;box-shadow:0 3px 0 var(--orange)}
  .ticker span{display:inline-block;padding-left:100%;animation:defile 22s linear infinite}
  @keyframes defile{to{transform:translateX(-100%)}}

  /* Étincelles */
  .spark{position:fixed;z-index:0;color:var(--lilas);pointer-events:none;animation:brille 2.8s ease-in-out infinite;text-shadow:0 0 12px #fff}
  @keyframes brille{0%,100%{opacity:.25;transform:scale(.7) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(20deg)}}

  header{text-align:center;padding:26px 0 8px}
  .logo{width:150px;height:150px;border-radius:34px;object-fit:cover;border:4px solid #fff;
    box-shadow:0 0 0 4px var(--peche),0 0 0 8px rgba(255,255,255,.35),0 14px 30px rgba(110,0,40,.45);
    animation:respire 5s ease-in-out infinite}
  @keyframes respire{50%{transform:translateY(-4px) rotate(-2deg)}}
  h1,h2,.btn,.chrome{font-family:'Shrikhand','Cooper Black','Arial Rounded MT Bold','Trebuchet MS',sans-serif;font-weight:400;letter-spacing:.3px}
  .chrome{color:var(--lilas);text-shadow:2px 2px 0 var(--orange),3px 3px 0 var(--peche)}
  h1{font-size:30px;margin-top:14px;line-height:1.1}
  .slogan{font-size:19px;margin-top:6px}
  .pres{margin:10px auto 0;max-width:420px;font-size:15px;line-height:1.45;opacity:.95}
  .lieu{display:inline-flex;gap:6px;align-items:center;margin-top:12px;padding:7px 14px;border-radius:999px;
    background:var(--verre);border:1.5px solid var(--bord);font-size:14px;backdrop-filter:blur(6px)}

  .carte{margin-top:18px;padding:18px 16px;border-radius:24px;background:var(--verre);border:1.5px solid var(--bord);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 10px 30px rgba(120,0,40,.18)}
  h2{font-size:21px;display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .num{flex:none;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;font-size:16px;
    background:radial-gradient(circle at 35% 30%,#fff,var(--lilas2));color:var(--rose);border:2px solid #fff;box-shadow:0 3px 0 var(--rose-fonce)}
  .grise{opacity:.45;pointer-events:none;filter:saturate(.6)}

  /* Prestations */
  .prestas{display:grid;gap:10px}
  .presta{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;padding:14px 16px;border-radius:18px;
    background:rgba(255,255,255,.12);border:1.5px solid var(--bord);transition:transform .15s}
  .presta:active{transform:scale(.98)}
  .presta b{display:block;font-size:16px}
  .presta small{display:block;opacity:.85;font-size:13px;margin-top:2px}
  .presta .duree{flex:none;font-family:'Shrikhand','Cooper Black','Arial Rounded MT Bold','Trebuchet MS',sans-serif;font-size:14px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.2)}
  .presta.on{background:linear-gradient(180deg,#fff 0%,var(--lilas) 48%,var(--lilas2) 52%,#fbe3ff 100%);color:var(--rose);border-color:#fff;
    box-shadow:0 4px 0 var(--rose-fonce),0 10px 22px rgba(120,0,40,.3)}
  .presta.on .duree{background:var(--rose);color:#fff}

  /* Jours */
  .jours{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x mandatory;scrollbar-width:none}
  .jours::-webkit-scrollbar{display:none}
  .jour{all:unset;cursor:pointer;flex:none;scroll-snap-align:start;width:64px;padding:8px 0;text-align:center;border-radius:18px;
    background:rgba(255,255,255,.12);border:1.5px solid var(--bord)}
  .jour .js{font-size:12px;text-transform:uppercase;opacity:.9}
  .jour .jn{font-family:'Shrikhand','Cooper Black','Arial Rounded MT Bold','Trebuchet MS',sans-serif;font-size:24px;line-height:1.1}
  .jour .jm{font-size:12px}
  .jour .dot{display:block;margin:4px auto 0;width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff}
  .jour.vide{opacity:.45}.jour.vide .dot{background:transparent;box-shadow:none;border:1px solid rgba(255,255,255,.6)}
  .jour.on{background:linear-gradient(180deg,#fff,var(--lilas) 50%,var(--lilas2) 52%,#fbe3ff);color:var(--rose);border-color:#fff;box-shadow:0 4px 0 var(--rose-fonce)}
  .jour.on .dot{background:var(--rose);box-shadow:none}

  /* Créneaux */
  .legende{display:flex;gap:14px;font-size:12px;margin:2px 0 10px;opacity:.95}
  .legende i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-1px}
  .slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
  .slot{all:unset;cursor:pointer;text-align:center;padding:10px 0;border-radius:14px;font-size:16px;font-weight:700;
    background:rgba(255,255,255,.2);border:1.5px solid #fff;box-shadow:0 3px 0 rgba(160,0,50,.45)}
  .slot.pris{cursor:default;background:rgba(80,0,30,.16);border:1.5px dashed rgba(255,255,255,.4);box-shadow:none;color:rgba(255,255,255,.55)}
  .slot.pris span{display:block;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .slot.pris s{text-decoration-thickness:2px}
  .slot.on{background:linear-gradient(180deg,#fff,var(--lilas) 50%,var(--lilas2) 52%,#fbe3ff);color:var(--rose);box-shadow:0 3px 0 var(--rose-fonce)}
  .info{font-size:14px;opacity:.95;padding:10px 0}

  /* Formulaire */
  .recap{padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.9);color:var(--encre);font-size:15px;line-height:1.4;margin-bottom:14px}
  .recap b{color:var(--rose)}
  label.champ{display:block;margin-bottom:12px;font-size:14px}
  label.champ em{font-style:normal;color:var(--lilas)}
  input[type=text],input[type=email],input[type=tel],textarea{width:100%;margin-top:5px;padding:12px 14px;border-radius:14px;border:2px solid #fff;
    background:rgba(255,255,255,.92);color:var(--encre);font:600 16px 'Quicksand',sans-serif;outline:none}
  input:focus,textarea:focus{box-shadow:0 0 0 4px rgba(246,221,248,.7)}
  textarea{min-height:84px;resize:vertical}
  label.case{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;font-size:14px;line-height:1.35;cursor:pointer}
  label.case input{flex:none;width:22px;height:22px;margin-top:-1px;accent-color:var(--rose)}
  .btn{all:unset;box-sizing:border-box;display:block;width:100%;text-align:center;cursor:pointer;margin-top:8px;padding:15px 18px;border-radius:999px;font-size:20px;
    color:var(--rose);background:linear-gradient(180deg,#fff 0%,var(--lilas) 46%,var(--lilas2) 54%,#fbe3ff 100%);border:2px solid #fff;
    box-shadow:0 5px 0 var(--rose-fonce),0 12px 26px rgba(120,0,40,.35);transition:transform .1s}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--rose-fonce)}
  .btn[disabled]{opacity:.6;pointer-events:none}
  .erreur{margin-top:12px;padding:10px 14px;border-radius:14px;background:rgba(80,0,30,.35);border:1.5px solid #fff;white-space:pre-line;font-size:14px}

  /* À savoir */
  .savoir li{list-style:none;position:relative;padding-left:24px;margin-bottom:9px;font-size:14px;line-height:1.45}
  .savoir li::before{content:"✦";position:absolute;left:0;top:-1px;color:var(--lilas)}

  /* Confirmation */
  .bravo{text-align:center;padding:26px 16px}
  .bravo .grand{font-size:56px;line-height:1;animation:brille 2s infinite}
  .bravo h2{justify-content:center;font-size:26px;margin:12px 0}
  .bravo p{font-size:15px;line-height:1.5}
  .chargement{text-align:center;padding:18px;font-size:14px}
  .chargement::before{content:"✧";display:inline-block;margin-right:6px;animation:tourne 1s linear infinite}
  @keyframes tourne{to{transform:rotate(360deg)}}
  footer{text-align:center;font-size:12px;opacity:.8;margin-top:26px}
  .demo{position:fixed;z-index:5;left:50%;bottom:10px;transform:translateX(-50%);background:#fff;color:var(--rose);font-size:12px;padding:5px 12px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="ticker" aria-hidden="true"><span id="ticker"></span></div>
<div id="sparks"></div>
<div class="wrap">
  <header>
    <img class="logo" alt="Logo French Baddies Nails" src="<?!= logo ?>">
    <h1 class="chrome" id="nom"></h1>
    <div class="slogan chrome" id="slogan"></div>
    <p class="pres" id="pres"></p>
    <div class="lieu" id="lieu"></div>
  </header>

  <main id="app">
    <section class="carte" id="etape1">
      <h2><span class="num">1</span>Ta prestation</h2>
      <div class="prestas" id="prestas"></div>
    </section>

    <section class="carte grise" id="etape2">
      <h2><span class="num">2</span>Ton créneau</h2>
      <div id="creneaux"><p class="info">Choisis d'abord une prestation ✧</p></div>
    </section>

    <section class="carte grise" id="etape3">
      <h2><span class="num">3</span>Tes infos</h2>
      <div id="recap" class="recap" hidden></div>
      <form id="form" novalidate></form>
    </section>

    <section class="carte" id="savoirCarte" hidden>
      <h2>À savoir</h2>
      <ul class="savoir" id="savoir"></ul>
    </section>
  </main>
  <footer>BaddiesPlans ✧ réservation en ligne</footer>
</div>

<script>
var BOOT = <?!= boot ?>;
var etat = { presta: null, jours: [], jour: null, slot: null };

/* Appel serveur (Apps Script) ou démo hors ligne */
function api(fn, arg) {
  return new Promise(function (ok, ko) {
    if (window.google && google.script && google.script.run) {
      google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) { ko(e && e.message ? e : new Error(String(e))); })[fn](arg);
    } else if (window.DEMO) {
      setTimeout(function () { try { ok(window.DEMO[fn](arg)); } catch (e) { ko(e); } }, 350);
    } else ko(new Error('Serveur indisponible'));
  });
}

function el(tag, attrs, kids) {
  var n = document.createElement(tag);
  for (var k in (attrs || {})) {
    if (k === 'text') n.textContent = attrs[k];
    else if (k === 'class') n.className = attrs[k];
    else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), attrs[k]);
    else n.setAttribute(k, attrs[k]);
  }
  (kids || []).forEach(function (c) { if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return n;
}
function $(id) { return document.getElementById(id); }
function duree(min) { var h = Math.floor(min / 60), m = min % 60; return h ? h + ' h' + (m ? ' ' + (m < 10 ? '0' : '') + m : '') : m + ' min'; }
function capital(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

function initEntete() {
  var s = BOOT.salon;
  $('nom').textContent = s.nom;
  $('slogan').textContent = s.slogan;
  $('pres').textContent = s.presentation;
  $('lieu').textContent = '📍 ' + [s.lieu, s.adresse].filter(Boolean).join(' · ');
  var t = ' ✦ ' + BOOT.prestations.map(function (p) { return p.nom; }).join(' ✦ ') + ' ✦ réserve en ligne ✦ ' + s.nom;
  $('ticker').textContent = t + t;
  if (s.aSavoir && s.aSavoir.length) {
    $('savoirCarte').hidden = false;
    s.aSavoir.forEach(function (x) { $('savoir').appendChild(el('li', { text: x })); });
  }
  var pos = [[6, 14, 22], [88, 10, 16], [92, 46, 26], [4, 62, 18], [80, 84, 20], [14, 90, 14]];
  pos.forEach(function (p, i) {
    $('sparks').appendChild(el('div', { class: 'spark', text: i % 2 ? '✧' : '✦', style: 'left:' + p[0] + '%;top:' + p[1] + '%;font-size:' + p[2] + 'px;animation-delay:' + (i * .45) + 's' }));
  });
}

function rendrePrestas() {
  var box = $('prestas'); box.innerHTML = '';
  if (!BOOT.prestations.length) { box.appendChild(el('p', { class: 'info', text: 'Aucune prestation disponible pour le moment.' })); return; }
  BOOT.prestations.forEach(function (p) {
    box.appendChild(el('button', {
      type: 'button', class: 'presta' + (etat.presta && etat.presta.id === p.id ? ' on' : ''),
      onclick: function () { choisirPresta(p); }
    }, [
      el('div', {}, [el('b', { text: p.nom }), p.description || p.prix ? el('small', { text: [p.description, p.prix].filter(Boolean).join(' · ') }) : null]),
      el('span', { class: 'duree', text: duree(p.duree) })
    ]));
  });
}

function choisirPresta(p) {
  etat.presta = p; etat.slot = null; etat.jour = null;
  rendrePrestas();
  $('etape2').classList.remove('grise');
  $('etape3').classList.add('grise');
  $('creneaux').innerHTML = '';
  $('creneaux').appendChild(el('div', { class: 'chargement', text: 'Je regarde le planning…' }));
  api('getCreneaux', p.id).then(function (jours) {
    etat.jours = jours;
    var premier = jours.filter(function (j) { return j.slots.some(function (s) { return s.libre; }); })[0] || jours[0];
    etat.jour = premier ? premier.cle : null;
    rendreCreneaux();
    $('etape2').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }).catch(function (e) {
    $('creneaux').innerHTML = '';
    $('creneaux').appendChild(el('div', { class: 'erreur', text: e.message }));
  });
}

function rendreCreneaux() {
  var box = $('creneaux'); box.innerHTML = '';
  if (!etat.jours.length) { box.appendChild(el('p', { class: 'info', text: 'Pas de créneau ouvert pour le moment, reviens bientôt ✧' })); return; }
  var bandeau = el('div', { class: 'jours' });
  etat.jours.forEach(function (j) {
    var libres = j.slots.filter(function (s) { return s.libre; }).length;
    bandeau.appendChild(el('button', {
      type: 'button', class: 'jour' + (libres ? '' : ' vide') + (etat.jour === j.cle ? ' on' : ''),
      'aria-label': j.jourSemaine + ' ' + j.jour + ' ' + j.mois + ', ' + libres + ' créneau(x) libre(s)',
      onclick: function () { etat.jour = j.cle; etat.slot = null; rendreCreneaux(); majFormulaire(); }
    }, [el('div', { class: 'js', text: j.jourSemaine.slice(0, 3) }), el('div', { class: 'jn', text: String(j.jour) }), el('div', { class: 'jm', text: j.mois }), el('i', { class: 'dot' })]));
  });
  box.appendChild(bandeau);
  box.appendChild(el('div', { class: 'legende' }, [
    el('span', {}, [el('i', { style: 'background:rgba(255,255,255,.35);border:1px solid #fff' }), 'Disponible']),
    el('span', {}, [el('i', { style: 'background:rgba(80,0,30,.2);border:1px dashed #fff' }), 'Déjà réservé'])
  ]));
  var jour = etat.jours.filter(function (j) { return j.cle === etat.jour; })[0];
  if (!jour || !jour.slots.length) { box.appendChild(el('p', { class: 'info', text: 'Rien ce jour-là, essaie un autre jour ✧' })); return; }
  var grille = el('div', { class: 'slots' });
  jour.slots.forEach(function (s) {
    if (!s.libre) { grille.appendChild(el('div', { class: 'slot pris', 'aria-label': s.heure + ' déjà réservé' }, [el('s', { text: s.heure }), el('span', { text: 'réservé' })])); return; }
    grille.appendChild(el('button', {
      type: 'button', class: 'slot' + (etat.slot && etat.slot.debut === s.debut ? ' on' : ''), text: s.heure,
      onclick: function () { etat.slot = s; rendreCreneaux(); majFormulaire(); $('etape3').scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    }));
  });
  box.appendChild(grille);
}

function majFormulaire() {
  var ok = etat.presta && etat.slot;
  $('etape3').classList.toggle('grise', !ok);
  $('recap').hidden = !ok;
  if (!ok) return;
  var j = etat.jours.filter(function (x) { return x.cle === etat.jour; })[0];
  $('recap').innerHTML = '';
  $('recap').appendChild(el('div', {}, [el('b', { text: etat.presta.nom }), ' · ' + duree(etat.presta.duree)]));
  $('recap').appendChild(el('div', { text: capital(j.jourSemaine) + ' ' + j.jour + ' ' + j.mois + ' à ' + etat.slot.heure.replace(':', 'h') }));
}

function construireFormulaire() {
  var f = $('form'); f.innerHTML = '';
  BOOT.questions.forEach(function (q) {
    var req = q.obligatoire;
    if (q.type === 'case') {
      f.appendChild(el('label', { class: 'case' }, [el('input', { type: 'checkbox', name: q.id }), el('span', { text: q.label + (req ? ' *' : '') })]));
      return;
    }
    var input = q.type === 'long'
      ? el('textarea', { name: q.id })
      : el('input', { name: q.id, type: q.type === 'email' ? 'email' : q.type === 'tel' ? 'tel' : 'text',
          autocomplete: q.type === 'email' ? 'email' : q.type === 'tel' ? 'tel' : (/nom/i.test(q.label) ? 'name' : 'off') });
    f.appendChild(el('label', { class: 'champ' }, [q.label, req ? el('em', { text: ' *' }) : null, input]));
  });
  var btn = el('button', { type: 'submit', class: 'btn', id: 'go', text: 'Je réserve ✦' });
  f.appendChild(btn);
  f.appendChild(el('div', { id: 'err' }));
  f.addEventListener('submit', envoyer);
}

function envoyer(ev) {
  ev.preventDefault();
  var f = $('form'), rep = {}, manque = [];
  BOOT.questions.forEach(function (q) {
    var c = f.elements[q.id];
    rep[q.id] = q.type === 'case' ? c.checked : c.value.trim();
    if (q.obligatoire && (q.type === 'case' ? !c.checked : !rep[q.id])) manque.push(q.label);
  });
  var err = $('err'); err.innerHTML = '';
  if (manque.length) { err.appendChild(el('div', { class: 'erreur', text: 'Il manque :\n• ' + manque.join('\n• ') })); return; }
  var btn = $('go'); btn.disabled = true; btn.textContent = 'Réservation…';
  api('reserver', { prestationId: etat.presta.id, debut: etat.slot.debut, reponses: rep }).then(function (r) {
    $('app').innerHTML = '';
    $('app').appendChild(el('section', { class: 'carte bravo' }, [
      el('div', { class: 'grand', text: '✦' }),
      el('h2', { class: 'chrome', text: 'C\'est réservé !' }),
      el('p', {}, [el('b', { text: r.prestation }), el('br'), r.quand, el('br'), r.lieu || '', el('br'), r.adresse || '']),
      el('p', { style: 'margin-top:12px;opacity:.9', text: r.email ? 'Une confirmation part à ' + r.email + ' ✧' : '' })
    ]));
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }).catch(function (e) {
    btn.disabled = false; btn.textContent = 'Je réserve ✦';
    err.appendChild(el('div', { class: 'erreur', text: e.message }));
    if (/pris/.test(e.message)) choisirPresta(etat.presta);
  });
}

initEntete();
rendrePrestas();
construireFormulaire();
if (window.DEMO) document.body.appendChild(el('div', { class: 'demo', text: 'Aperçu — données fictives' }));
</script>
</body>
</html>
