<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>French Baddies Nails — Prendre rendez-vous</title>
<meta name="description" content="Réserve ta pose américaine, ton nail art ou ta manucure chez French Baddies Nails, à Caen.">
<meta name="theme-color" content="#ff5a1a">
<meta property="og:title" content="French Baddies Nails — Prendre rendez-vous">
<meta property="og:description" content="Choisis ton créneau en ligne ✦ poses américaines, nail art, manucures à Caen">
<meta property="og:image" content="https://frenchbaddiesplans.github.io/logo.jpg">
<meta property="og:type" content="website">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(160deg,#fe7766 0%,#ff5a1a 30%,#ff0a5e 68%,#ff6601 100%)}
  .attente{position:fixed;inset:0;display:grid;place-items:center;color:#f6ddf8;font:600 16px system-ui,sans-serif}
  .attente span{display:inline-block;margin-right:8px;animation:tourne 1s linear infinite}
  @keyframes tourne{to{transform:rotate(360deg)}}
  iframe{position:fixed;inset:0;width:100%;height:100%;height:100dvh;border:0;background:transparent}
  .pause{position:fixed;inset:0;display:none;place-items:center;padding:24px;text-align:center;color:#fff;font:600 17px/1.5 system-ui,sans-serif}
  .pause div{max-width:420px;padding:28px 22px;border-radius:24px;background:rgba(255,255,255,.16);border:1.5px solid rgba(246,221,248,.7)}
  .pause img{width:120px;height:120px;border-radius:28px;border:4px solid #fff;margin-bottom:16px}
  .pause h1{margin:0 0 10px;font-size:26px;color:#f6ddf8}
</style>
</head>
<body>
<div class="pause" id="pause"><div><img src="logo.jpg" alt="French Baddies Nails"><h1>Petite pause ✦</h1><p id="msgPause"></p></div></div>
<div class="attente" id="attente"><div><span>✦</span>Chargement du planning…</div></div>
<iframe id="outil" title="Prendre rendez-vous chez French Baddies Nails" allow="clipboard-write"></iframe>
<script>
  // ===== MODE MAINTENANCE =====
  // Si Google ne répond plus : mets true à la place de false, puis « Commit changes ».
  // Pour remettre en route : remets false.
  var MAINTENANCE = false;
  var MESSAGE = "La réservation en ligne est momentanément indisponible. Envoie-moi un DM sur Instagram pour prendre rendez-vous, merci !";
  // ============================

  // Adresse de l'outil Apps Script. Ne change que si un NOUVEAU déploiement est créé.
  var OUTIL = 'https://script.google.com/macros/s/AKfycbxsQ_4qSpHJUCa_axL7aI9C3ZBIr_dagr3PITUe8gEDmq5AQQqy6R-WM9RvpM1qd00/exec';
  // Transmet ?annuler=… (lien des e-mails) et ?admin=… (espace privé) à l'outil.
  if (MAINTENANCE) {
    document.getElementById('outil').remove();
    document.getElementById('attente').remove();
    document.getElementById('msgPause').textContent = MESSAGE;
    document.getElementById('pause').style.display = 'grid';
  } else {
    document.getElementById('outil').src = OUTIL + location.search;
  }
</script>
</body>
</html>
